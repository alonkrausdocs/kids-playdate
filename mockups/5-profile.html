<!doctype html><html><head><meta charset='utf-8'><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,'DejaVu Sans',sans-serif}
body{width:390px;height:844px;overflow:hidden;background:#fff;color:#20232A;position:relative}
.sb{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 4px;font-size:13px;font-weight:600;color:#20232A}

.field{border:1.5px solid #E3E5E8;border-radius:14px;padding:10px 14px;font-size:14.5px;margin-bottom:9px;color:#20232A}
.field span{float:right;color:#C4C9CF}
.vbadge{display:inline-flex;align-items:center;gap:4px;background:#E7F8EE;color:#12994F;font-size:11px;font-weight:700;padding:4px 9px;border-radius:12px}
.navbar{position:absolute;bottom:0;left:0;right:0;height:74px;border-top:1px solid #EEEFF1;display:flex;justify-content:space-around;align-items:center;background:#fff;padding-bottom:12px}
.photo{position:relative;overflow:hidden}
.sil{position:absolute;left:50%;bottom:0;transform:translateX(-50%)}
</style></head><body>
